<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img" aria-label="Esquema del período de retorno combinado" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="940" height="320" fill="#ffffff"/><line x1="80" y1="260" x2="470" y2="260" stroke="#1d2733" stroke-width="2"/><line x1="80" y1="260" x2="80" y2="30" stroke="#1d2733" stroke-width="2"/><text x="275" y="296" text-anchor="middle" font-size="13" fill="#1d2733">X (por ejemplo, duración)</text><text x="14" y="22" font-size="13" fill="#1d2733">Y (por ejemplo, intensidad)</text><rect x="250" y="40" width="210" height="140" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="355" y="92" text-anchor="middle" font-size="13.5" fill="#b4491f" font-weight="700">X ≥ x  y  Y ≥ y</text><text x="355" y="118" text-anchor="middle" font-size="12.5" fill="#1d2733">P = 1 − F_X(x) − F_Y(y)</text><text x="355" y="138" text-anchor="middle" font-size="12.5" fill="#1d2733">+ C( F_X(x), F_Y(y) )</text><line x1="250" y1="260" x2="250" y2="180" stroke="#b4491f" stroke-dasharray="4 3"/><line x1="80" y1="180" x2="250" y2="180" stroke="#b4491f" stroke-dasharray="4 3"/><text x="246" y="278" font-size="13" fill="#b4491f" font-weight="700">x</text><text x="62" y="184" font-size="13" fill="#b4491f" font-weight="700">y</text><circle cx="120" cy="230" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="150" cy="205" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="170" cy="238" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="210" cy="218" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="290" cy="62" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="432" cy="160" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="140" cy="250" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="190" cy="195" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="230" cy="240" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="110" cy="200" r="4" fill="#1f5f8b" opacity="0.8"/><circle cx="106" cy="46" r="4" fill="#1f5f8b"/><text x="116" y="50" font-size="12" fill="#56606b">evento observado</text><text x="560" y="70" font-size="14" font-weight="700" fill="#1d2733">Período de retorno</text><text x="560" y="98" font-size="13.5" fill="#1d2733">T(x, y) = N / ( n · P )</text><text x="560" y="128" font-size="12.8" fill="#56606b" xml:space="preserve">N: años de registro (del primer</text><text x="560" y="148" font-size="12.8" fill="#56606b" xml:space="preserve">    al último evento)</text><text x="560" y="168" font-size="12.8" fill="#56606b" xml:space="preserve">n: cantidad de eventos observados</text><text x="560" y="188" font-size="12.8" fill="#56606b" xml:space="preserve">n / N: eventos por año (la tasa)</text><text x="560" y="208" font-size="12.8" fill="#56606b" xml:space="preserve">P: probabilidad de que un evento</text><text x="560" y="228" font-size="12.8" fill="#56606b" xml:space="preserve">    supere a la vez x e y</text><text x="560" y="272" font-size="12.8" fill="#b4491f" font-weight="700">Duración entera: «al menos k días»</text><text x="560" y="291" font-size="12.8" fill="#b4491f" font-weight="700">se evalúa en k − 0,5</text></svg>