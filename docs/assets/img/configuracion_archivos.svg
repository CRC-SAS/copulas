<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Qué archivos intervienen en una corrida" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="940" height="360" fill="#ffffff"/><text x="20" y="24" font-size="13" font-weight="700" fill="#56606b">LO QUE TRAÉS VOS</text><text x="330" y="24" font-size="13" font-weight="700" fill="#56606b">CONFIGURACIÓN</text><text x="700" y="24" font-size="13" font-weight="700" fill="#56606b">RESULTADOS</text><rect x="20" y="36" width="270" height="92" rx="9" fill="#f4f6f8" stroke="#56606b" stroke-width="1.6"/><text x="30" y="58" font-size="13.2" font-weight="700" fill="#56606b">CSV de eventos</text><text x="30" y="79" font-size="12.5" fill="#1d2733">data/input/ (no viene en el repo)</text><text x="30" y="96" font-size="12.5" fill="#1d2733">Una fila por evento: estación,</text><text x="30" y="113" font-size="12.5" fill="#1d2733">tipo, fechas, duración, intensidad…</text><rect x="20" y="142" width="270" height="76" rx="9" fill="#f4f6f8" stroke="#56606b" stroke-width="1.6"/><text x="30" y="164" font-size="13.2" font-weight="700" fill="#56606b">enso_roni.txt</text><text x="30" y="185" font-size="12.5" fill="#1d2733">data/input/ (no viene en el repo)</text><text x="30" y="202" font-size="12.5" fill="#1d2733">Índice RONI por trimestre</text><rect x="330" y="36" width="330" height="70" rx="9" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><text x="340" y="58" font-size="13.2" font-weight="700" fill="#1f5f8b">configuracion_copulas.yml</text><text x="340" y="79" font-size="12.5" fill="#1d2733">Dónde está el proyecto y cuántos procesos</text><text x="340" y="96" font-size="12.5" fill="#1d2733">Se crea una vez (copia de la plantilla)</text><rect x="330" y="116" width="330" height="86" rx="9" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><text x="340" y="138" font-size="13.2" font-weight="700" fill="#b4491f">parametros_copulas.yml</text><text x="340" y="159" font-size="12.5" fill="#1d2733">Qué se analiza: estaciones, variables,</text><text x="340" y="176" font-size="12.5" fill="#1d2733">tipo de evento y criterios.</text><text x="340" y="193" font-size="12.5" fill="#1d2733">Se edita en cada corrida</text><rect x="330" y="212" width="330" height="70" rx="9" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><text x="340" y="234" font-size="11.6" font-weight="700" fill="#b4491f">data/configuracion_archivos_utilizados.yml</text><text x="340" y="255" font-size="12" fill="#1d2733">Nombres de archivos y el identificador</text><text x="340" y="272" font-size="12" fill="#1d2733">de la corrida (cambialo en cada una)</text><rect x="700" y="36" width="225" height="102" rx="9" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><text x="710" y="58" font-size="13.2" font-weight="700" fill="#2e7d4f">data/output/</text><text x="710" y="79" font-size="12.5" fill="#1d2733">copulas_&lt;id&gt;.rds</text><text x="710" y="96" font-size="12.5" fill="#1d2733">periodo_retorno_*.png</text><text x="710" y="113" font-size="12.5" fill="#1d2733">mejores_ajustes_*.rds</text><rect x="700" y="150" width="225" height="66" rx="9" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><text x="710" y="172" font-size="13.2" font-weight="700" fill="#2e7d4f">data/partial/</text><text x="710" y="193" font-size="12.5" fill="#1d2733">Resultados intermedios</text><text x="710" y="210" font-size="12.5" fill="#1d2733">(estacionariedad, dependencia…)</text><rect x="700" y="228" width="225" height="54" rx="9" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><text x="710" y="250" font-size="13.2" font-weight="700" fill="#2e7d4f">run/</text><text x="710" y="271" font-size="12.5" fill="#1d2733">Registro: CalcCopulas.log</text><rect x="330" y="296" width="330" height="48" rx="9" fill="#1d2733"/><text x="495" y="326" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Rscript 01_copulas.R</text><line x1="660" y1="321" x2="692" y2="255" stroke="#56606b" stroke-width="2"/><polygon points="700,255 690,250 690,260" fill="#56606b"/><polyline points="290,82 310,82 310,321 322,321" fill="none" stroke="#56606b" stroke-width="2"/><polyline points="290,180 310,180" fill="none" stroke="#56606b" stroke-width="2"/><polygon points="330,321 320,316 320,326" fill="#56606b"/><text x="20" y="318" font-size="12" fill="#56606b">Las cuatro decisiones de cada corrida</text><text x="20" y="336" font-size="12" fill="#56606b">están en parametros_copulas.yml:</text><text x="20" y="354" font-size="12" fill="#56606b">estaciones, variables, tipo y duración mínima.</text></svg>