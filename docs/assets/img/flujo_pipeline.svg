<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 232" width="940" height="232" role="img" aria-label="Flujo del pipeline en seis etapas" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="940" height="232" fill="#ffffff"/><rect x="15" y="20" width="140" height="170" rx="10" fill="#f4f6f8" stroke="#56606b" stroke-width="1.6"/><rect x="15" y="20" width="140" height="34" rx="10" fill="#56606b"/><rect x="15" y="40" width="140" height="14" fill="#56606b"/><text x="85.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Entradas</text><text x="25" y="76" font-size="12.5" fill="#1d2733">CSV de eventos</text><text x="25" y="95" font-size="12.5" fill="#1d2733">(por ubicación)</text><text x="25" y="114" font-size="12.5" fill="#1d2733">Archivo ENSO</text><text x="25" y="133" font-size="12.5" fill="#1d2733">3 archivos YAML</text><line x1="156" y1="105.0" x2="161" y2="105.0" stroke="#56606b" stroke-width="2"/><polygon points="168,105.0 159,100.0 159,110.0" fill="#56606b"/><rect x="169" y="20" width="140" height="170" rx="10" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><rect x="169" y="20" width="140" height="34" rx="10" fill="#1f5f8b"/><rect x="169" y="40" width="140" height="14" fill="#1f5f8b"/><text x="239.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Preparación</text><text x="179" y="76" font-size="12.5" fill="#1d2733">Paso 4</text><text x="179" y="95" font-size="12.5" fill="#1d2733">Filtra los eventos</text><text x="179" y="114" font-size="12.5" fill="#1d2733">Clasifica ENSO</text><text x="179" y="133" font-size="12.5" fill="#1d2733">Serie observada y</text><text x="179" y="152" font-size="12.5" fill="#1d2733">series perturbadas</text><line x1="310" y1="105.0" x2="315" y2="105.0" stroke="#56606b" stroke-width="2"/><polygon points="322,105.0 313,100.0 313,110.0" fill="#56606b"/><rect x="323" y="20" width="140" height="170" rx="10" fill="#e8f1f8" stroke="#1f5f8b" stroke-width="1.6"/><rect x="323" y="20" width="140" height="34" rx="10" fill="#1f5f8b"/><rect x="323" y="40" width="140" height="14" fill="#1f5f8b"/><text x="393.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Marginales</text><text x="333" y="76" font-size="12.5" fill="#1d2733">Pasos 5 a 7</text><text x="333" y="95" font-size="12.5" fill="#1d2733">13 distribuciones</text><text x="333" y="114" font-size="12.5" fill="#1d2733">L-momentos y MLE</text><text x="333" y="133" font-size="12.5" fill="#1d2733">KS, AD, CvM</text><text x="333" y="152" font-size="12.5" fill="#1d2733">RMSE, CCC, QCOMHD</text><text x="333" y="171" font-size="12.5" fill="#1d2733">Mejor por variable</text><line x1="464" y1="105.0" x2="469" y2="105.0" stroke="#56606b" stroke-width="2"/><polygon points="476,105.0 467,100.0 467,110.0" fill="#56606b"/><rect x="477" y="20" width="140" height="170" rx="10" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><rect x="477" y="20" width="140" height="34" rx="10" fill="#b4491f"/><rect x="477" y="40" width="140" height="14" fill="#b4491f"/><text x="547.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Filtros</text><text x="487" y="76" font-size="12.5" fill="#1d2733">Pasos 8 y 9</text><text x="487" y="95" font-size="12.5" fill="#1d2733">Estacionariedad:</text><text x="487" y="114" font-size="12.5" fill="#1d2733">5 tests, Bonferroni</text><text x="487" y="133" font-size="12.5" fill="#1d2733">Dependencia:</text><text x="487" y="152" font-size="12.5" fill="#1d2733">Kendall, Spearman,</text><text x="487" y="171" font-size="12.5" fill="#1d2733">cópula empírica</text><line x1="618" y1="105.0" x2="623" y2="105.0" stroke="#56606b" stroke-width="2"/><polygon points="630,105.0 621,100.0 621,110.0" fill="#56606b"/><rect x="631" y="20" width="140" height="170" rx="10" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><rect x="631" y="20" width="140" height="34" rx="10" fill="#2e7d4f"/><rect x="631" y="40" width="140" height="14" fill="#2e7d4f"/><text x="701.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Cópulas</text><text x="641" y="76" font-size="12.5" fill="#1d2733">Pasos 10 a 12</text><text x="641" y="95" font-size="12.5" fill="#1d2733">6 familias</text><text x="641" y="114" font-size="12.5" fill="#1d2733">Sn, AIC, BIC, MRE,</text><text x="641" y="133" font-size="12.5" fill="#1d2733">RMSE, v. cruzada</text><text x="641" y="152" font-size="12.5" fill="#1d2733">Mejor familia</text><text x="641" y="171" font-size="12.5" fill="#1d2733">Mvdc final</text><line x1="772" y1="105.0" x2="777" y2="105.0" stroke="#56606b" stroke-width="2"/><polygon points="784,105.0 775,100.0 775,110.0" fill="#56606b"/><rect x="785" y="20" width="140" height="170" rx="10" fill="#efe9f7" stroke="#6b4a9a" stroke-width="1.6"/><rect x="785" y="20" width="140" height="34" rx="10" fill="#6b4a9a"/><rect x="785" y="40" width="140" height="14" fill="#6b4a9a"/><text x="855.0" y="42" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Retorno</text><text x="795" y="76" font-size="12.5" fill="#1d2733">Pasos 13 y 14</text><text x="795" y="95" font-size="12.5" fill="#1d2733">T bivariado</text><text x="795" y="114" font-size="12.5" fill="#1d2733">(isolíneas)</text><text x="795" y="133" font-size="12.5" fill="#1d2733">T univariado</text><text x="795" y="152" font-size="12.5" fill="#1d2733">Gráficos y .rds</text><text x="15" y="222" font-size="12.5" fill="#56606b">Los pasos 5 a 14 se reparten en paralelo (una tarea por ubicación, variable o serie). Un par solo llega a la cópula si pasa los filtros.</text></svg>