<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="Decisión de ajuste de la cópula para cada par" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><rect width="940" height="440" fill="#ffffff"/><rect x="20" y="140" width="150" height="64" rx="10" fill="#f4f6f8" stroke="#56606b" stroke-width="1.6"/><text x="95.0" y="159.5" text-anchor="middle" font-size="12.8" fill="#1d2733">Par (ubicación,</text><text x="95.0" y="176.5" text-anchor="middle" font-size="12.8" fill="#1d2733">tipo de evento,</text><text x="95.0" y="193.5" text-anchor="middle" font-size="12.8" fill="#1d2733">variables x e y)</text><line x1="170" y1="172" x2="215" y2="172" stroke="#56606b" stroke-width="2"/><polygon points="215,172 205.0,167.0 205.0,177.0" fill="#56606b"/><polygon points="300,122.0 385.0,172 300,222.0 215.0,172" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><text x="300" y="160.5" text-anchor="middle" font-size="12.5" fill="#1d2733">¿Las dos series</text><text x="300" y="176.5" text-anchor="middle" font-size="12.5" fill="#1d2733">observadas son</text><text x="300" y="192.5" text-anchor="middle" font-size="12.5" fill="#1d2733">estacionarias?</text><line x1="385" y1="172" x2="430" y2="172" stroke="#56606b" stroke-width="2"/><polygon points="430,172 420.0,167.0 420.0,177.0" fill="#56606b"/><polygon points="515,122.0 600.0,172 515,222.0 430.0,172" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><text x="515" y="160.5" text-anchor="middle" font-size="12.5" fill="#1d2733">¿Las variables</text><text x="515" y="176.5" text-anchor="middle" font-size="12.5" fill="#1d2733">son dependientes?</text><text x="515" y="192.5" text-anchor="middle" font-size="12.5" fill="#1d2733">(τ > 0 positivo)</text><line x1="600" y1="172" x2="645" y2="172" stroke="#56606b" stroke-width="2"/><polygon points="645,172 635.0,167.0 635.0,177.0" fill="#56606b"/><rect x="645" y="118" width="275" height="108" rx="10" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><text x="782.5" y="142.5" text-anchor="middle" font-size="12.8" fill="#1d2733">Se ajustan las 6 familias a la</text><text x="782.5" y="159.5" text-anchor="middle" font-size="12.8" fill="#1d2733">serie observada y a las 2</text><text x="782.5" y="176.5" text-anchor="middle" font-size="12.8" fill="#1d2733">perturbadas; se miden Sn,</text><text x="782.5" y="193.5" text-anchor="middle" font-size="12.8" fill="#1d2733">AIC, BIC, MRE, RMSE y validación</text><text x="782.5" y="210.5" text-anchor="middle" font-size="12.8" fill="#1d2733">cruzada</text><line x1="782" y1="226" x2="782" y2="262" stroke="#56606b" stroke-width="2"/><polygon points="782,262 787.0,252.0 777.0,252.0" fill="#56606b"/><rect x="645" y="262" width="275" height="64" rx="10" fill="#e7f4ec" stroke="#2e7d4f" stroke-width="1.6"/><text x="782.5" y="290.0" text-anchor="middle" font-size="12.8" fill="#1d2733">Mejor familia y parámetro = mediana</text><text x="782.5" y="307.0" text-anchor="middle" font-size="12.8" fill="#1d2733">de los ajustes; se arma el Mvdc</text><line x1="782" y1="326" x2="782" y2="362" stroke="#56606b" stroke-width="2"/><polygon points="782,362 787.0,352.0 777.0,352.0" fill="#56606b"/><rect x="645" y="362" width="275" height="56" rx="10" fill="#efe9f7" stroke="#6b4a9a" stroke-width="1.6"/><text x="782.5" y="394.5" text-anchor="middle" font-size="12.8" fill="#1d2733">T combinado + isolíneas</text><line x1="300" y1="222" x2="300" y2="282" stroke="#b4491f" stroke-width="2"/><polygon points="300,282 305.0,272.0 295.0,272.0" fill="#b4491f"/><line x1="515" y1="222" x2="515" y2="282" stroke="#b4491f" stroke-width="2"/><polygon points="515,282 520.0,272.0 510.0,272.0" fill="#b4491f"/><rect x="190" y="282" width="440" height="78" rx="10" fill="#fbeee7" stroke="#b4491f" stroke-width="1.6"/><text x="410.0" y="308.5" text-anchor="middle" font-size="12.8" fill="#1d2733">Sin cópula para ese par.</text><text x="410.0" y="325.5" text-anchor="middle" font-size="12.8" fill="#1d2733">Las marginales y el período de retorno</text><text x="410.0" y="342.5" text-anchor="middle" font-size="12.8" fill="#1d2733">univariado se calculan igual.</text><text x="310" y="250" font-size="12" fill="#b4491f" font-weight="700">no</text><text x="525" y="250" font-size="12" fill="#b4491f" font-weight="700">no</text><text x="392" y="162" font-size="12" fill="#2e7d4f" font-weight="700">sí</text><text x="607" y="162" font-size="12" fill="#2e7d4f" font-weight="700">sí</text><text x="20" y="30" font-size="14" font-weight="700" fill="#1d2733">Qué pasa con cada par de variables</text><text x="20" y="52" font-size="12.5" fill="#56606b">Con los valores por defecto (exigir.estacionariedad y exigir.serie.observada en true).</text></svg>