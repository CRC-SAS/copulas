# ------------------------------------------------------------------------------
# Definicion de configuraciones de eventos a ser analizadas.
# ------------------------------------------------------------------------------
configuraciones.eventos:
  - [ conf_id, indice, escala, distribucion,   metodo_ajuste ]
  - [       1,  "OlaCalor",  0,  "Empirica", "NoParametrico" ]
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Definicion de las variables a ser contempladas en las cópulas
# ------------------------------------------------------------------------------
variables_copulas:
  # A pedido de Nati (11/8/2026): probar la copula intensidad-duracion.
  # duracion tiene pocos valores distintos (heavy ties) -> ver
  # variables_sin_test_continuidad mas abajo, que evita que el ajuste
  # univariado la rechace por KS/AD/CvM (tests pensados para variables
  # continuas). TestSn (copula::gofCopula) puede seguir fallando por el
  # mismo motivo, ver README.md "Problemas conocidos".
  # Los 3 pares se ajustan en la misma corrida (no hace falta repetir el
  # pipeline por par); lo que sí varía por corrida es eventos.tipo, ver
  # pruebas/correr_18_escenarios.sh.
  - { variable_x: "intensidad", variable_y: "duracion" }
  - { variable_x: "intensidad", variable_y: "magnitud" }
  - { variable_x: "duracion",   variable_y: "magnitud" }
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Definicion de parametros para buscar eventos
# ------------------------------------------------------------------------------
eventos:
  tipo: "calor"
  duracion_minima: 3 # Expresado en dias (Olas.rds no usa pentadas)
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Definicion valores mínimos para la detección
# ------------------------------------------------------------------------------
valores_minimos:
  - { variable: "duracion",   valor_minimo_deteccion: 1   }
  - { variable: "intensidad", valor_minimo_deteccion: 0.1 }
  - { variable: "magnitud",   valor_minimo_deteccion: 0.1 }
  - { variable: "minimo",     valor_minimo_deteccion: 0.1 }
  - { variable: "maximo",     valor_minimo_deteccion: 0.1 }
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Umbral de p-valor para dictaminar que el test de normalidad falla
# ------------------------------------------------------------------------------
umbral.p.valor: 0.05
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Variables cuya serie es discreta (pocos valores distintos, muchos empates,
# ej. duracion medida en dias/pentadas enteras) para las que los tests de
# bondad de ajuste KS/Anderson-Darling/Cramér-von Mises (que asumen una
# distribucion continua) se omiten al elegir el mejor ajuste univariado. El
# ajuste se sigue evaluando (y seleccionando entre distribuciones candidatas)
# en base a RMSEIQR/CCC/QCOMHD. Dejar vacío para no exceptuar ninguna variable.
# ------------------------------------------------------------------------------
variables_sin_test_continuidad: ["duracion"]
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Período de retorno combinado (co-occurrence) para las cópulas finales.
# Gráfico análogo a la Figura 7 de Chen et al. 2024: eje x = variable_x, eje y
# = variable_y, contornos = años de retorno T = N/(n*(1-Fx-Fy+C(Fx,Fy))).
# ------------------------------------------------------------------------------
periodo_retorno:
  niveles_anios: [2, 5, 10, 20, 50, 100, 200, 500]
  resolucion_grilla: 100
  # Cuanto extender la grilla mas alla del maximo observado, como fraccion
  # del rango observado de cada variable (0 = no extender)
  margen_grilla: 0.4
  # Si es TRUE, ademas de la curva de periodo de retorno univariado (PASO 14)
  # genera por cada estacion+variable un histograma de los eventos observados
  # con la densidad de la distribucion ganadora superpuesta (analogo a la
  # Figura 5 de Chen et al. 2024). FALSE por defecto: son 59 estaciones x 3
  # variables = muchos PNG adicionales por corrida, se activa solo para
  # validacion puntual.
  graficar_distribucion_ajuste: FALSE
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Número de series perturbadas a ser consideradas
# ------------------------------------------------------------------------------
n.series.perturbadas: 2
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Número de realizaciones del generador a ser utilizadas
# ------------------------------------------------------------------------------
n.realizaciones: 1
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Semilla para la generación de las series perturbadas
# ------------------------------------------------------------------------------
s.series.perturbadas: 123
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Tests a ser considerados para determinar la estacionariedad
# ------------------------------------------------------------------------------
tests.estacionariedad: ["BoxPierceLjungBox", "PuntoCambioUni",
                        'PuntoCambioAutocopula', 'MannKendall',
                        "EstacionaridadEmpirico"]
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Tests a ser considerados para determinar la dependencia
# ------------------------------------------------------------------------------
tests.dependencia: ["Kendall", "Spearman", "CopulaEmpirica"]
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Configuraciones para el ajuste multivariado
# ------------------------------------------------------------------------------
configuracion.ajuste.copula:
  - [ familia,   funcion_ajuste,   uso_sequias ]
  - [ "gumbel",  "AjustarCopulaGumbel",   TRUE ]
  - [ "frank",   "AjustarCopulaFrank",    TRUE ]
  - [ "joe",     "AjustarCopulaJoe",      TRUE ]
  - [ "clayton", "AjustarCopulaClayton",  TRUE ]
  - [ "normal",  "AjustarCopulaNormal",   TRUE ]
  - [ "t",       "AjustarCopulatstudent", TRUE ]
# ------------------------------------------------------------------------------

